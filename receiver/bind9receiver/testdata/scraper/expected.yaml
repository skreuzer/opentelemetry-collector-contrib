                  timeUnixNano: "2000000"
                - asInt: "0"
                  attributes:
                    - key: opcode
                      value:
                        stringValue: UPDATE
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: queries
          - description: Total number of responses sent by the server, by rcode
            name: bind9.server.responses
            sum:
              aggregationTemporality: 2
              dataPoints:
                - asInt: "0"
                  attributes:
                    - key: rcode
                      value:
                        stringValue: BADCOOKIE
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "0"
                  attributes:
                    - key: rcode
                      value:
                        stringValue: BADVERS
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "0"
                  attributes:
                    - key: rcode
                      value:
                        stringValue: FORMERR
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "95"
                  attributes:
                    - key: rcode
                      value:
                        stringValue: NOERROR
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "0"
                  attributes:
                    - key: rcode
                      value:
                        stringValue: NOTAUTH
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "0"
                  attributes:
                    - key: rcode
                      value:
                        stringValue: NOTIMP
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "0"
                  attributes:
                    - key: rcode
                      value:
                        stringValue: NOTZONE
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "3"
                  attributes:
                    - key: rcode
                      value:
                        stringValue: NXDOMAIN
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "0"
                  attributes:
                    - key: rcode
                      value:
                        stringValue: NXRRSET
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "0"
                  attributes:
                    - key: rcode
                      value:
