                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
                - asInt: "0"
                  attributes:
                    - key: rcode
                      value:
                        stringValue: YXRRSET
                  startTimeUnixNano: "1000000"
                  timeUnixNano: "2000000"
              isMonotonic: true
            unit: responses
        scope:
          name: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/bind9receiver
          version: latest
